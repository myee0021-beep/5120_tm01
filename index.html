<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SaringKu</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --maroon:#2E5C8A;
    --maroon-dark:#1F4166;
    --maroon-bg:#e8eef5;
    --tan-border:#d9b98c;
    --card-bg:#f1ede6;
    --page-bg:#e9e5de;
    --green:#4c8c4a;
    --green-bg:#e4f2d8;
    --dot-green:#5fae5a;
    --amber:#b8860b;
    --amber-bg:#fdf6e3;
    --dot-amber:#d9a441;
    --dot-red:#d9a441;
    --red-circle:#e2483f;
    --text-dark:#222;
    --text-mid:#555;
    --text-light:#888;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:#fff;
    color:var(--text-dark);
  }
  a{ text-decoration:none; }

  /* ---------- top nav ---------- */
  .topnav{
    display:flex;
    align-items:center;
    gap:28px;
    padding:14px 6vw;
    border-bottom:1px solid #eee;
    position:sticky;
    top:0;
    background:#fff;
    z-index:1000;
    flex-wrap:wrap;
  }
  .topnav-brand{ font-size:20px; font-weight:800; color:var(--maroon); margin-right:8px; }
  .topnav-tabs{ display:flex; gap:6px; flex:1; flex-wrap:wrap; }
  .tab-btn{
    background:none;
    border:none;
    padding:9px 16px;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    color:var(--text-mid);
    cursor:pointer;
  }
  .tab-btn:hover{ background:var(--card-bg); }
  .tab-btn.active{ background:var(--maroon); color:#fff; }
  .lang-toggle{ font-size:12px; cursor:pointer; user-select:none; }
  .lang-toggle span{ color:var(--text-light); padding:2px 4px; }
  .lang-toggle span.active{ color:var(--maroon); font-weight:700; }

  /* ---------- page sections ---------- */
  .page{ display:none; }
  .page.active{ display:block; animation:fadeIn .3s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  .container-narrow{ max-width:900px; margin:0 auto; padding:50px 6vw 90px; }
  .container-wide{ max-width:1100px; margin:0 auto; padding:50px 6vw 90px; }

  /* ---------- home page ---------- */
  .hero-banner{
    background:linear-gradient(135deg, var(--maroon) 0%, #1F4166 55%, #142c46 100%);
    padding:80px 6vw;
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:50px;
    flex-wrap:wrap;
  }
  .hero-banner::before{
    content:'';
    position:absolute;
    right:-10%; top:-30%;
    width:520px; height:520px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.08) 0%, rgba(255,255,255,0) 70%);
  }
  .hero-banner-inner{ max-width:560px; position:relative; text-align:left; }
  .hero-badge{
    display:inline-block;
    font-size:11.5px;
    font-weight:700;
    letter-spacing:.04em;
    color:#f3e6c9;
    background:rgba(255,255,255,.12);
    padding:6px 14px;
    border-radius:999px;
    margin-bottom:22px;
  }
  .hero-banner h1{ font-size:46px; line-height:1.12; color:#fff; margin:0 0 18px; font-weight:800; }
  .hero-banner p{ font-size:15.5px; color:#eaded9; line-height:1.6; margin:0 0 28px; max-width:480px; }

  .hero-illustration{ flex-shrink:0; width:300px; max-width:100%; position:relative; z-index:1; }
  .hero-illustration svg{ width:100%; height:auto; display:block; }
  .hero-pulse-path{
    fill:none;
    stroke:#f3e6c9;
    stroke-width:2.5;
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-dasharray:340;
    stroke-dashoffset:340;
    animation:heroPulseDraw 2.6s ease-in-out infinite;
  }
  @keyframes heroPulseDraw{
    0%{ stroke-dashoffset:340; }
    50%{ stroke-dashoffset:0; }
    85%{ stroke-dashoffset:0; opacity:1; }
    100%{ stroke-dashoffset:-340; opacity:0; }
  }
  @keyframes heroPulseFadeIn{ from{opacity:0;} to{opacity:1;} }

  .btn{
    background:var(--maroon);
    color:#fff;
    border:none;
    padding:13px 24px;
    border-radius:8px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    display:inline-block;
  }
  .btn:hover{ background:var(--maroon-dark); }
  .btn-outline{
    background:#fff;
    color:var(--maroon);
    border:1.5px solid var(--maroon);
    padding:12px 22px;
    border-radius:8px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  .features{ display:flex; gap:24px; justify-content:center; padding:44px 6vw 70px; flex-wrap:wrap; max-width:1100px; margin:0 auto; }

  /* home interactive map */
  .home-map-section{ max-width:1100px; margin:0 auto; padding:44px 6vw 10px; }
  .home-map-header{
    display:flex; align-items:flex-end; justify-content:space-between; gap:20px;
    margin-bottom:16px; flex-wrap:wrap;
  }
  .home-map-eyebrow{ font-size:11px; font-weight:700; letter-spacing:.06em; color:var(--maroon); margin-bottom:6px; }
  .home-map-legend{ display:flex; gap:24px; padding:14px 4px 0; font-size:12.5px; color:var(--text-mid); flex-wrap:wrap; }
  .legend-dot{ display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; vertical-align:middle; }
  .legend-dot.green{ background:var(--dot-green); }
  .legend-dot.amber{ background:var(--dot-amber); }

  /* stat row */
  .stat-row{ display:flex; gap:24px; justify-content:center; padding:50px 6vw 20px; flex-wrap:wrap; }
  .stat-card{ background:var(--card-bg); border-radius:12px; padding:26px 34px; text-align:center; min-width:150px; }
  .stat-num{ font-size:32px; font-weight:800; margin-bottom:4px; }
  .stat-label{ font-size:12px; color:var(--text-mid); }

  /* DOSM callout */
  .home-callout{ padding:10px 6vw 50px; }
  .home-callout-inner{
    max-width:720px; margin:0 auto;
    background:var(--maroon-bg);
    border:1px solid #d5e0ec;
    border-left:5px solid var(--maroon);
    border-radius:14px; padding:32px 36px; text-align:center;
  }
  .home-callout-eyebrow{ font-size:11px; font-weight:700; letter-spacing:.06em; color:var(--maroon); margin-bottom:10px; }
  .home-callout-text{ font-size:18px; color:#1a2d40; line-height:1.5; font-weight:600; }
  .home-callout-source{ font-size:11px; color:var(--text-mid); margin-top:12px; }

  .section-title{ font-size:26px; margin:0 0 34px; }

  /* settings page */
  .settings-card{ background:#fff; border:1px solid #eee; border-radius:14px; padding:8px 26px; box-shadow:0 1px 3px rgba(0,0,0,.04); }
  .settings-card-label{ font-size:11px; font-weight:700; letter-spacing:.05em; color:var(--text-light); padding-top:16px; border-bottom:1px solid #eee; padding-bottom:12px; }
  .settings-row{
    display:flex; align-items:center; justify-content:space-between; gap:20px;
    padding:20px 0; border-bottom:1px solid #eee;
  }
  .settings-row:last-child{ border-bottom:none; }
  .settings-row-left{ display:flex; align-items:center; gap:16px; }
  .settings-icon{
    width:42px; height:42px; min-width:42px; border-radius:10px; background:var(--maroon-bg);
    display:flex; align-items:center; justify-content:center; font-size:18px;
  }
  .settings-row-title{ font-size:14.5px; font-weight:700; margin-bottom:4px; }
  .settings-row-desc{ font-size:12.5px; color:var(--text-mid); line-height:1.5; }
  .switch{ position:relative; display:inline-block; width:44px; height:26px; flex-shrink:0; }
  .switch input{ opacity:0; width:0; height:0; }
  .switch-track{
    position:absolute; cursor:pointer; inset:0; background:#ccc; border-radius:999px; transition:.2s;
  }
  .switch-track::before{
    content:''; position:absolute; height:20px; width:20px; left:3px; bottom:3px;
    background:#fff; border-radius:50%; transition:.2s;
  }
  .switch input:checked + .switch-track{ background:var(--maroon); }
  .switch input:checked + .switch-track::before{ transform:translateX(18px); }
  .settings-highlight{
    background:var(--amber-bg); border:1px solid #eddca0; border-radius:12px;
    padding:18px 22px; margin-top:22px;
  }
  .settings-highlight-title{ font-size:14px; font-weight:700; color:var(--amber); margin-bottom:6px; }
  .settings-highlight p{ font-size:13px; color:#5c4a1a; line-height:1.55; margin:0; }
  .settings-note{ font-size:12px; color:var(--text-light); margin-top:18px; text-align:center; }
  .settings-actions{ display:flex; justify-content:space-between; gap:16px; margin-top:28px; }
  .settings-actions .btn, .settings-actions .btn-outline{ flex:1; }
  .feature-card{
    flex:1; min-width:220px; max-width:320px; text-align:center;
    background:#fff; border:1px solid #eee; border-radius:14px; padding:30px 24px;
    box-shadow:0 1px 3px rgba(0,0,0,.04);
  }
  .feature-icon{
    width:52px; height:52px; margin:0 auto 16px; border-radius:12px; background:var(--maroon-bg);
    display:flex; align-items:center; justify-content:center; font-size:24px;
  }
  .feature-card h3{ font-size:16px; margin:0 0 8px; }
  .feature-card p{ font-size:13.5px; color:var(--text-mid); line-height:1.55; margin:0; }
  .site-footer{ text-align:center; padding:40px 6vw 60px; border-top:1px solid #eee; }
  .site-footer p{ font-size:12px; color:var(--text-light); margin:8px 0 0; }

  /* ---------- Check My Risk page ---------- */
  .card-block{ background:var(--card-bg); border-radius:14px; padding:34px; }
  .page-eyebrow{ font-size:11px; font-weight:700; letter-spacing:.06em; color:var(--text-light); margin-bottom:8px; text-transform:uppercase; }

  /* guide accordion */
  .guide-card{ background:#fff; border:1px solid #eee; border-radius:14px; padding:8px 22px 14px; box-shadow:0 1px 3px rgba(0,0,0,.04); }
  .guide-card-label{ font-size:11px; font-weight:700; letter-spacing:.05em; color:var(--text-light); padding-top:16px; border-bottom:1px solid #eee; padding-bottom:12px; }
  .accordion-item{ border-bottom:1px solid #eee; }
  .accordion-item:last-child{ border-bottom:none; }
  .accordion-head{
    width:100%; background:none; border:none; cursor:pointer;
    display:flex; align-items:center; gap:14px; padding:16px 4px;
    font-family:inherit; text-align:left;
  }
  .accordion-num{
    width:28px; height:28px; min-width:28px; border-radius:50%; background:var(--maroon-bg); color:var(--maroon);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px;
  }
  .accordion-title{ flex:1; font-size:14.5px; font-weight:700; color:var(--maroon); }
  .accordion-chev{ color:var(--maroon); font-size:18px; transition:transform .2s; }
  .accordion-item.open .accordion-chev{ transform:rotate(90deg); }
  .accordion-item.open .accordion-head{ background:var(--maroon-bg); border-radius:10px; }
  .accordion-body{ max-height:0; overflow:hidden; transition:max-height .25s ease; }
  .accordion-item.open .accordion-body{ max-height:200px; }
  .accordion-body p{ font-size:13.5px; color:var(--text-mid); line-height:1.6; margin:0; padding:4px 4px 16px 46px; }

  h2.page-title{ font-size:26px; margin:0 0 6px; }
  .page-sub{ font-size:13.5px; color:var(--text-light); margin:0 0 26px; }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px 20px; }
  .form-grid .full{ grid-column:1 / -1; }
  label.field-label{ display:block; font-size:11px; letter-spacing:.03em; color:var(--text-mid); margin-bottom:6px; text-transform:uppercase; }
  .input, select.input{
    width:100%; padding:12px 14px; border:1.5px solid var(--tan-border); border-radius:8px;
    background:#fffdf9; font-size:15px; color:#222; appearance:none; -webkit-appearance:none;
  }
  select.input{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%23888'/></svg>");
    background-repeat:no-repeat; background-position:right 14px center;
  }
  .input-icon-wrap{ position:relative; }
  .input-icon-wrap .icon{ position:absolute; right:14px; top:50%; transform:translateY(-50%); color:var(--text-light); font-size:14px; cursor:pointer; }
  .field-error{ font-size:11.5px; color:var(--dot-red); margin-top:10px; display:none; }

  .risk-eyebrow{ color:var(--maroon); font-weight:700; font-size:13px; letter-spacing:.04em; }
  .risk-lead{ font-size:14px; color:var(--text-mid); margin:8px 0 2px; }
  .risk-headline{ font-size:32px; font-weight:800; color:var(--maroon); margin:2px 0 20px; text-transform:uppercase; line-height:1.15; }
  .risk-info{ background:#fff; border-radius:10px; padding:20px; font-size:14px; line-height:1.6; color:#333; margin-bottom:26px; }
  .compare-label{ font-size:11.5px; letter-spacing:.05em; color:var(--text-mid); text-transform:uppercase; margin-bottom:8px; }
  .bar{ height:14px; border-radius:4px; margin-bottom:8px; transition:width .4s ease; }
  .bar.you{ background:var(--maroon); }
  .bar.rec{ background:#8fbf7f; }
  .bar-caption{ font-size:13px; color:#333; margin-bottom:16px; }
  .bar-caption.muted{ color:var(--text-light); font-size:12px; }

  /* ---------- Find a Clinic page ---------- */
  .clinic-controls{ display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap; margin-bottom:22px; }
  .clinic-controls .field{ min-width:220px; }
  .mode-toggle{ display:flex; gap:8px; }
  .mode-btn{
    padding:11px 18px; border-radius:8px; border:1.5px solid var(--tan-border);
    background:#fffdf9; font-size:14px; font-weight:600; color:var(--text-mid); cursor:pointer;
  }
  .mode-btn.active{ background:var(--maroon); border-color:var(--maroon); color:#fff; }
  .map-wrap-full{ height:340px; border-radius:12px; overflow:hidden; border:1px solid var(--tan-border); margin-bottom:26px; position:relative; z-index:1; }
  .clinic-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:16px; }
  .clinic-card{
    background:#fff; border-radius:12px; padding:18px; cursor:pointer;
    border:1px solid #eee; border-left:4px solid var(--dot-green);
    box-shadow:0 1px 3px rgba(0,0,0,.04);
  }
  .clinic-card.amber{ border-left-color:var(--dot-amber); }
  .clinic-card.selected{ border-color:var(--maroon); border-left-color:var(--maroon); background:var(--maroon-bg); }
  .clinic-card-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .clinic-icon{
    width:34px; height:34px; border-radius:9px; background:var(--card-bg);
    display:flex; align-items:center; justify-content:center; font-size:15px;
  }
  .status-pill{ font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; }
  .status-pill.green{ background:var(--green-bg); color:var(--green); }
  .status-pill.amber{ background:var(--amber-bg); color:var(--amber); }
  .clinic-card .name-row{ font-weight:700; font-size:15px; margin-bottom:6px; }
  .clinic-card .desc{ font-size:12.5px; color:var(--text-light); line-height:1.5; margin-bottom:14px; }
  .clinic-card-bottom{ display:flex; align-items:center; justify-content:space-between; }
  .clinic-cost{ font-size:20px; font-weight:800; color:var(--maroon); }
  .clinic-details-link{ font-size:12.5px; font-weight:600; color:var(--maroon); }

  /* ---------- My Plan page ---------- */
  .qualify-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); gap:18px; margin-bottom:8px; }
  .qualify-card{ background:var(--card-bg); border-radius:12px; padding:20px 22px; }
  .qualify-head{ display:flex; align-items:flex-start; gap:10px; font-weight:700; font-size:16px; }
  .check{ width:20px; height:20px; min-width:20px; background:var(--green); border-radius:50%; color:#fff; font-size:13px; display:flex; align-items:center; justify-content:center; margin-top:1px; }
  .qualify-desc{ margin:10px 0 4px 30px; font-size:13.5px; color:#444; line-height:1.55; }
  .qualify-link{ margin-left:30px; color:var(--maroon); font-size:14px; font-weight:600; cursor:pointer; }
  .target-date{ text-align:center; font-size:13px; color:var(--text-mid); margin:20px 0 6px; }

  .banner-card{ border:1.5px solid var(--tan-border); border-radius:12px; text-align:center; padding:26px 16px; margin:14px 0 24px; }
  .banner-card .free{ color:var(--maroon); font-weight:800; font-size:26px; letter-spacing:.03em; }
  .banner-card .zero{ color:#c9a84c; font-weight:700; font-size:16px; margin:2px 0 6px; letter-spacing:.05em; }
  .banner-card .note{ font-size:12.5px; color:var(--text-light); }
  .section-h{ color:var(--maroon); font-weight:700; font-size:12.5px; letter-spacing:.03em; margin:20px 0 8px; }
  ul.plain{ margin:0 0 6px; padding-left:20px; font-size:13.5px; color:#333; line-height:1.65; }
  .eligible-note{ font-size:11px; color:var(--text-light); margin:-4px 0 6px 20px; }
  .two-col{ display:flex; gap:30px; }
  .two-col ul{ flex:1; }
  .price-box{ background:var(--green-bg); border-radius:8px; text-align:center; padding:14px; margin:18px 0 8px; font-size:13.5px; color:#444; }
  .price-box .amt{ color:var(--green); font-weight:800; font-size:17px; }
  ol.plain{ margin:6px 0 6px; padding-left:20px; font-size:13.5px; color:#333; line-height:1.65; }
  .back-link{ display:inline-block; margin-bottom:20px; font-size:13.5px; color:var(--maroon); font-weight:600; cursor:pointer; }

  .save-icon{ width:70px; height:70px; border-radius:50%; border:3px solid var(--red-circle); display:flex; align-items:center; justify-content:center; margin:0 auto 24px; }
  .save-icon svg{ width:32px; height:32px; }
  .save-heading{ text-align:center; font-size:24px; font-weight:800; letter-spacing:.02em; margin-bottom:36px; }
  .save-sub{ text-align:center; font-size:15px; font-weight:700; letter-spacing:.03em; margin-bottom:16px; }
  ul.save-list{ list-style:disc; margin:0 auto; padding-left:22px; font-size:14px; color:#333; line-height:1.75; max-width:400px; }
  .save-actions{ text-align:center; margin-top:36px; }

  @media (max-width:700px){
    .form-grid{ grid-template-columns:1fr; }
    .hero-banner h1{ font-size:34px; }
    .two-col{ flex-direction:column; gap:4px; }
    .hero-banner{ text-align:center; justify-content:center; }
    .hero-banner-inner{ text-align:center; margin:0 auto; }
    .hero-banner p{ margin-left:auto; margin-right:auto; }
    .hero-illustration{ width:200px; order:-1; }
  }

  /* ---------- loading screen ---------- */
  #loadingScreen{
    position:fixed; inset:0;
    background:#fff;
    z-index:9999;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    transition:opacity .5s ease, visibility .5s ease;
  }
  #loadingScreen.hide{ opacity:0; visibility:hidden; pointer-events:none; }
  .loading-pulse{ width:74px; height:74px; margin-bottom:18px; }
  .loading-pulse svg{ width:100%; height:100%; }
  .loading-pulse-line{
    stroke:var(--maroon);
    stroke-width:2.4;
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-dasharray:120;
    stroke-dashoffset:120;
    animation:loadPulseDraw 1.1s ease-in-out infinite;
  }
  @keyframes loadPulseDraw{
    0%{ stroke-dashoffset:120; }
    45%{ stroke-dashoffset:0; }
    55%{ stroke-dashoffset:0; }
    100%{ stroke-dashoffset:-120; }
  }
  .loading-logo{ font-size:30px; font-weight:800; color:var(--maroon); margin-bottom:26px; letter-spacing:.01em; }
  .loading-bar-track{ width:220px; height:6px; background:var(--card-bg); border-radius:999px; overflow:hidden; }
  .loading-bar-fill{
    height:100%;
    background:var(--maroon);
    width:0%;
    border-radius:999px;
    animation:loadFill 1.7s ease forwards;
  }
  @keyframes loadFill{ from{ width:0%; } to{ width:100%; } }
</style>
</head>
<body>

<div id="loadingScreen">
  <div class="loading-pulse">
    <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
      <polyline class="loading-pulse-line" points="2,32 16,32 21,18 27,44 33,26 38,32 58,32"></polyline>
    </svg>
  </div>
  <div class="loading-logo">SaringKu</div>
  <div class="loading-bar-track"><div class="loading-bar-fill"></div></div>
</div>

<nav class="topnav">
  <div class="topnav-brand">SaringKu</div>
  <div class="topnav-tabs">
    <button class="tab-btn active" data-tab="home" onclick="showTab('home')" id="navHome"></button>
    <button class="tab-btn" data-tab="guide" onclick="showTab('guide')" id="navGuide"></button>
    <button class="tab-btn" data-tab="risk" onclick="showTab('risk')" id="navRisk"></button>
    <button class="tab-btn" data-tab="clinics" onclick="showTab('clinics')" id="navClinics"></button>
    <button class="tab-btn" data-tab="plan" onclick="showTab('plan')" id="navPlan"></button>

  function getAgeGroup(age){
    if(age <= 14) return '0-14';
    if(age <= 40) return '15-40';
    if(age <= 59) return '41-59';
    return '60+';
  }

  /* Checks a profile object against a scheme's condition set. Unknown/unset profile fields
     (e.g. socso_insured, nationality) default to true, matching this app's target persona
     (an employed, Malaysian, SOCSO-contributing user) since the form does not collect them. */
  function matchesConditions(cond, profile){
    if(!cond) return false;
    if(cond.age_min !== undefined && profile.age < cond.age_min) return false;
    if(cond.age_max !== undefined && profile.age > cond.age_max) return false;
    if(cond.household_band !== undefined && profile.household_band !== cond.household_band) return false;
    if(cond.is_smoker !== undefined && cond.is_smoker !== profile.is_smoker) return false;
    if(cond.has_health_risk !== undefined && cond.has_health_risk !== profile.has_health_risk) return false;
    if(cond.socso_insured !== undefined && cond.socso_insured !== (profile.socso_insured !== false)) return false;
    if(cond.nationality !== undefined && cond.nationality !== (profile.nationality || 'malaysian')) return false;
    return true;
  }

  function evaluateSchemes(profile){
    return schemesData.map(scheme => {
      const eligible = matchesConditions(scheme.conditions, profile) ||
                        (scheme.alt_conditions && matchesConditions(scheme.alt_conditions, profile));
      return { scheme, eligible };
    });
  }

  function calcRisk(){
    const age = Number(document.getElementById('age').value || 0);
    const sex = document.getElementById('sex').value;
    const smoke = document.getElementById('smoke').value;
    const lastCheck = document.getElementById('lastCheck').value;
    const householdBand = document.getElementById('householdBand').value;

    if(!document.getElementById('age').value || !smoke || !lastCheck){
      document.getElementById('p-error').style.display = 'block';
      return false;
    }
    document.getElementById('p-error').style.display = 'none';

    // risk score still drives the "you vs recommended" visual comparison and the
    // has_health_risk flag used by SOCSO HSP's 30-39 alt eligibility condition
    let score = 0;
    if(age >= 40) score += 2;
    if(smoke === 'daily') score += 2;
    else if(smoke === 'sometimes') score += 1;
    if(lastCheck === 'gt5') score += 2;
    else if(lastCheck === '1to5') score += 1;

    // leading cause + share_pct now come straight from DOSM Risk_Data.json (age-band first,
    // falling back to sex-band if no age-band match — age-band always matches here)
    const ageGroup = getAgeGroup(age);
    const ageBand = riskData.by_age_band[ageGroup];
    const sexBand = sex ? riskData.by_sex[sex] : null;
    const causeEn = ageBand.top_cause_en;
    const causeBm = ageBand.top_cause_bm;
    const sharePct = ageBand.share_pct;

    const lastCheckLabel = lastCheckOptions.find(o=>o.value===lastCheck);

    lastResult = {
      score, age, ageGroup, sharePct,
      headline: { en:causeEn.toUpperCase(), bm:causeBm.toUpperCase() },
      info: {
        en: `Among Malaysians aged ${ageGroup}, ${causeEn.toLowerCase()} accounts for ${sharePct}% of certified deaths (DOSM 2025), the leading cause in this age group.` +
            (sexBand ? ` For ${sex === 'male' ? 'men' : 'women'} nationally, ${sexBand.top_cause_en.toLowerCase()} leads at ${sexBand.share_pct}%.` : ''),
        bm: `Bagi rakyat Malaysia berumur ${ageGroup}, ${causeBm.toLowerCase()} menyumbang ${sharePct}% daripada kematian disahkan (DOSM 2025), punca utama dalam kumpulan umur ini.` +
            (sexBand ? ` Bagi ${sex === 'male' ? 'lelaki' : 'wanita'} secara kebangsaan, ${sexBand.top_cause_bm.toLowerCase()} mendahului pada ${sexBand.share_pct}%.` : ''),
      },
      youWidth: lastCheck === 'gt5' ? 90 : lastCheck === '1to5' ? 60 : 30,
      recWidth: age >= 40 ? 25 : 70,
      youText: {
        en: 'You: ' + lastCheckLabel.en + ' since last check',
        bm: 'Anda: ' + lastCheckLabel.bm + ' sejak pemeriksaan terakhir',
      },
      recText: age >= 40
        ? { en:'Recommended: Every year from 40', bm:'Disyorkan: Setiap tahun dari umur 40' }
        : { en:'Recommended: General check-up every 2–3 years', bm:'Disyorkan: Pemeriksaan umum setiap 2-3 tahun' },
    };

    lastProfile = {
      age, sex, householdBand,
      household_band: householdBand,
      is_smoker: smoke !== 'never' && smoke !== '',
      has_health_risk: score >= 2,
      socso_insured: true,      // assumed: form doesn't collect this; matches target persona (employed, SOCSO-contributing)
      nationality: 'malaysian', // assumed: form doesn't collect this; matches target persona
    };
    lastEligibility = evaluateSchemes(lastProfile);

    return true;
  }

          : (currentLang==='en' ? 'Limited hours' : 'Waktu terhad');
        return `
        <div class="clinic-card ${isGreen ? '' : 'amber'}" onclick="selectClinicCard(${i}, this)">
          <div class="clinic-card-top">
            <div class="clinic-icon">${isGreen ? '🏥' : '🕒'}</div>
            <span class="status-pill ${isGreen ? 'green' : 'amber'}">${badgeText}</span>
          </div>
          <div class="name-row">${c.name}${mqit ? ' (mQuit)' : ''}</div>
          <div class="desc">${c.desc}</div>
          <div class="clinic-card-bottom">
            <div class="clinic-cost">${costLabel}</div>
            <div class="clinic-details-link">${currentLang==='en' ? 'Details' : 'Butiran'} ›</div>
          </div>
        </div>`;
      }).join('');

    if(mainMap){
      mainMarkers.forEach(m => mainMap.removeLayer(m));
      if(mainDepotMarker) mainMap.removeLayer(mainDepotMarker);
      const centerLat = clinics.reduce((sum,c)=>sum+c.lat,0) / clinics.length;
      const centerLng = clinics.reduce((sum,c)=>sum+c.lng,0) / clinics.length;
      const depotIcon = L.divIcon({ className:'', html:'<div style="width:12px;height:12px;border-radius:50%;background:#2E5C8A;border:2px solid #fff;box-shadow:0 0 0 2px #2E5C8A55;"></div>' });
      mainDepotMarker = L.marker([centerLat, centerLng], { icon: depotIcon }).addTo(mainMap).bindPopup(currentLang==='en' ? 'Your area (demo location)' : 'Kawasan anda (lokasi demo)');
      mainMarkers = clinics.map((c,i)=>{
        const color = c.status === 'green' ? '#5fae5a' : '#d9a441';
        const icon = L.divIcon({ className:'', html:`<div style="width:14px;height:14px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4);"></div>` });
        const m = L.marker([c.lat, c.lng], { icon }).addTo(mainMap);
        m.bindPopup(c.name);
        m.on('click', ()=> selectClinicCardByIndex(i));
        return m;
      });
      mainMap.setView([centerLat, centerLng], 12);
    }
  }

  function selectClinicCard(idx, el){
    document.querySelectorAll('.clinic-card').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    if(mainMap && mainMarkers[idx] && currentClinics[idx]){
      const c = currentClinics[idx];
      mainMap.setView([c.lat, c.lng], 15);
      mainMarkers[idx].openPopup();
    }
  }
  function selectClinicCardByIndex(idx){
    const cards = document.querySelectorAll('.clinic-card');
    cards.forEach(c => c.classList.remove('selected'));
    if(cards[idx]) cards[idx].classList.add('selected');
    if(currentClinics[idx]) mainMap.setView([currentClinics[idx].lat, currentClinics[idx].lng], 15);
  }

  function initMainMap(){
    if(mainMap || typeof L === 'undefined') return;
    mainMap = L.map('map-main', { zoomControl:true, attributionControl:false }).setView([3.5, 102.5], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:18 }).addTo(mainMap);
  }

  function simulateLocate(){
    const icon = document.getElementById('locateIcon');
    icon.textContent = '…';
    setTimeout(()=>{
      document.getElementById('state').value = 'Selangor';
      icon.textContent = '✓';
      setTimeout(()=>{ icon.textContent = '◎'; }, 1200);
    }, 700);
  }

  /* ================= tab navigation ================= */
  /* guide page: accordion toggle (single-open, click again to close) */
  function toggleAccordion(btn){
    const item = btn.closest('.accordion-item');
    const wasOpen = item.classList.contains('open');
    item.parentElement.querySelectorAll('.accordion-item').forEach(i => i.classList.remove('open'));
    if(!wasOpen) item.classList.add('open');
  }

  function showTab(name){
    currentTab = name;
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    window.scrollTo({ top:0, behavior:'instant' });

    if(name === 'home'){
      initHomeMap();
      setTimeout(()=>{ if(homeMap) homeMap.invalidateSize(); }, 150);
    }
    if(name === 'clinics'){
      if(document.getElementById('clinicState').value === '') document.getElementById('clinicState').value = 'Selangor';
      initMainMap();
      setTimeout(()=>{ if(mainMap) mainMap.invalidateSize(); refreshClinicsPage(); }, 150);
    }
    if(name === 'plan'){
      renderPlanCards();
    }
    if(name === 'settings'){
      loadSettingsToggles();
    }
  }

  /* ================= settings toggles (UI-only demo, no live notification backend) ================= */
  function loadSettingsToggles(){
    let data = {};
    try{ data = JSON.parse(localStorage.getItem('saringku_settings')) || {}; }catch(e){}
    document.getElementById('toggleDoctorChange').checked = !!data.doctorChange;
    document.getElementById('toggleNewDoctor').checked = !!data.newDoctor;
    document.getElementById('toggleTargetDate').checked = !!data.targetDate;
  }
  function saveSettingsToggles(){
    const data = {
      doctorChange: document.getElementById('toggleDoctorChange').checked,
      newDoctor: document.getElementById('toggleNewDoctor').checked,
      targetDate: document.getElementById('toggleTargetDate').checked,
    };
    try{ localStorage.setItem('saringku_settings', JSON.stringify(data)); }catch(e){}
  }
  function resetSettingsToggles(){
    document.getElementById('toggleDoctorChange').checked = false;
    document.getElementById('toggleNewDoctor').checked = false;
    document.getElementById('toggleTargetDate').checked = false;
    saveSettingsToggles();
  }
  function confirmSettingsToggles(){
    saveSettingsToggles();
    const btn = document.getElementById('set-save-btn');
    const original = btn.textContent;
    btn.textContent = currentLang === 'en' ? '✓ Saved' : '✓ Disimpan';
    setTimeout(()=>{ btn.textContent = original; }, 1400);
  }

  /* Renders the qualify-grid using live eligibility results from evaluateSchemes().
     If the person hasn't actually completed Check My Risk yet, shows a prompt instead of
     silently calculating a "plan" off whatever happens to be sitting in the form. */
  function renderPlanCards(){
    const grid = document.getElementById('qualify-grid-main');
    const targetEl = document.getElementById('t-target');
    const saveBtn = document.getElementById('t-btn');

    if(!lastEligibility){
      grid.innerHTML = `
        <div style="grid-column:1/-1;text-align:center;padding:40px 20px;background:var(--card-bg);border-radius:12px;">
          <p style="font-size:14px;color:var(--text-mid);margin:0 0 18px;">
            ${currentLang==='en'
              ? "You haven't completed Check My Risk yet — do that first so we can show what you actually qualify for."
              : 'Anda belum melengkapkan Semak Risiko Saya — lengkapkannya dahulu supaya kami boleh tunjukkan apa yang anda layak dapat.'}
          </p>
          <button class="btn" onclick="showTab('risk')">${currentLang==='en' ? 'Check My Risk  →' : 'Semak Risiko Saya  →'}</button>
        </div>`;
      targetEl.style.display = 'none';
      saveBtn.style.display = 'none';
      return;
    }
    targetEl.style.display = '';
    saveBtn.style.display = '';

    grid.innerHTML = lastEligibility.map(({scheme, eligible}) => `
      <div class="qualify-card" style="${eligible ? '' : 'opacity:.55;'}">
        <div class="qualify-head">
          <span class="check" style="${eligible ? '' : 'background:#999;'}">${eligible ? '✓' : '–'}</span>
          <span>${scheme[currentLang==='en' ? 'name_en' : 'name_bm']}</span>
        </div>
        <div class="qualify-desc">${scheme[currentLang==='en' ? 'copy_en' : 'copy_bm']}</div>
        ${eligible
          ? `<div class="qualify-link" onclick="openScheme('${scheme.id}')">${currentLang==='en' ? 'View details' : 'Lihat butiran'}  →</div>`
          : `<div class="qualify-desc" style="font-style:italic;">${currentLang==='en' ? 'Not currently eligible' : 'Tidak layak buat masa ini'}</div>`
        }
      </div>
    `).join('');
  }

  function openScheme(schemeId){
    const scheme = schemesData.find(s => s.id === schemeId);
    if(!scheme) return;
    if(scheme.route === 'clinics-klinik'){ goToClinicsFromPlan('klinik'); return; }
    if(scheme.route === 'clinics-moh'){ goToClinicsFromPlan('moh'); return; }
    showPlanVoucher(scheme);
  }

  function goToClinicsFromPlan(mode){
    setClinicMode(mode);
    showTab('clinics');
  }

  function showPlanVoucher(scheme){
    document.getElementById('plan-cards-block').style.display = 'none';
    document.getElementById('plan-voucher-block').style.display = 'block';
    document.getElementById('plan-saved-block').style.display = 'none';

    document.getElementById('v-title').textContent = scheme[currentLang==='en' ? 'name_en' : 'name_bm'];
    document.getElementById('v-cost-big').textContent = scheme.cost_rm === 0 ? 'FREE' : ('RM ' + scheme.cost_rm);
    document.getElementById('v-note').textContent = scheme[currentLang==='en' ? 'copy_en' : 'copy_bm'];

    const cond = { ...scheme.conditions };
    const whyItems = [];
    if(cond.age_min !== undefined || cond.age_max !== undefined){
      whyItems.push(currentLang==='en'
        ? `Aged ${cond.age_min || 0}${cond.age_max ? '–' + cond.age_max : '+'}`
        : `Berumur ${cond.age_min || 0}${cond.age_max ? '–' + cond.age_max : '+'}`);
    }
    if(cond.socso_insured) whyItems.push(currentLang==='en' ? 'Active SOCSO contributor' : 'Pencarum PERKESO aktif');
    if(cond.household_band) whyItems.push(currentLang==='en' ? `Household income band: ${cond.household_band}` : `Kumpulan pendapatan isi rumah: ${cond.household_band}`);
    if(cond.is_smoker) whyItems.push(currentLang==='en' ? 'Current smoker' : 'Perokok semasa');
    if(cond.nationality) whyItems.push(currentLang==='en' ? 'Malaysian citizen' : 'Warganegara Malaysia');
    if(whyItems.length === 0) whyItems.push(currentLang==='en' ? 'Open to everyone, no conditions' : 'Terbuka untuk semua, tiada syarat');
    document.getElementById('v-why-list').innerHTML = whyItems.map(t => `<li>${t}</li>`).join('');

    document.getElementById('v-covers-list').innerHTML = scheme.covers.map(c => `<li>${c}</li>`).join('');
    document.getElementById('v-pay').textContent = (currentLang==='en' ? 'You pay: ' : 'Anda bayar: ') + (scheme.cost_rm === 0 ? 'RM 0' : ('RM ' + scheme.cost_rm));
    document.getElementById('v-howto').textContent = scheme[currentLang==='en' ? 'how_to_access_en' : 'how_to_access_bm'];

    const btn1 = document.getElementById('v-btn1');
    btn1.href = scheme.url;
    btn1.textContent = (currentLang==='en' ? 'OPEN ' : 'BUKA ') + scheme.provider.toUpperCase() + '  →';
    document.getElementById('v-btn2').textContent = currentLang==='en' ? 'BACK TO MY PLAN  →' : 'KEMBALI KE PELAN SAYA  →';
    document.getElementById('v-back').textContent = currentLang==='en' ? '‹ Back' : '‹ Kembali';

    lastOpenedScheme = scheme;
  }
  function showPlanCards(){
    document.getElementById('plan-cards-block').style.display = 'block';
    document.getElementById('plan-voucher-block').style.display = 'none';
    document.getElementById('plan-saved-block').style.display = 'none';
  }
  function showPlanSaved(){
    document.getElementById('plan-cards-block').style.display = 'none';
    document.getElementById('plan-voucher-block').style.display = 'none';
    document.getElementById('plan-saved-block').style.display = 'block';
  }
  let lastOpenedScheme = null;

  /* ================= language ================= */
  function applyLang(){
    for(const id in dict){
      const el = document.getElementById(id);
      if(el) el.textContent = dict[id][currentLang];
    }
    buildSelect(document.getElementById('sex'), sexOptions, document.getElementById('sex').value);
    buildSelect(document.getElementById('state'), stateList, document.getElementById('state').value || 'Selangor');
    buildSelect(document.getElementById('smoke'), smokeOptions, document.getElementById('smoke').value);
    buildSelect(document.getElementById('lastCheck'), lastCheckOptions, document.getElementById('lastCheck').value);
    buildSelect(document.getElementById('householdBand'), householdBandOptions, document.getElementById('householdBand').value);
    buildSelect(document.getElementById('clinicState'), stateList, document.getElementById('clinicState').value || 'Selangor');

    document.getElementById('langEN').classList.toggle('active', currentLang === 'en');
    document.getElementById('langBM').classList.toggle('active', currentLang === 'bm');
    renderHasil();
    renderHomeStats();
    if(currentTab === 'plan'){
      if(document.getElementById('plan-voucher-block').style.display === 'block' && lastOpenedScheme){
        showPlanVoucher(lastOpenedScheme);
      } else {
        renderPlanCards();
      }
    }
  }

  /* homepage: interactive map showing every demo clinic across all 16 states */
  let homeMap = null;
  let homeMapMarkers = [];
  let homeMapInited = false;

  function initHomeMap(){
    if(homeMap || typeof L === 'undefined') return;
    homeMap = L.map('map-home', { zoomControl:true, attributionControl:false }).setView([4.2, 108.5], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:18 }).addTo(homeMap);
    renderHomeMapMarkers();
    setTimeout(()=> homeMap.invalidateSize(), 150);
    homeMapInited = true;
  }

  function renderHomeMapMarkers(){
    if(!homeMap) return;
    homeMapMarkers.forEach(m => homeMap.removeLayer(m));
    homeMapMarkers = [];
    Object.keys(stateData).forEach(stateName => {
      getClinicsForState(stateName).forEach(c => {
        const color = c.status === 'green' ? '#5fae5a' : '#d9a441';
        const icon = L.divIcon({ className:'', html:`<div style="width:12px;height:12px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4);"></div>` });
        const m = L.marker([c.lat, c.lng], { icon }).addTo(homeMap);
        m.bindPopup(`<strong>${c.name}</strong><br>${stateName}<br><span style="font-size:11px;color:#888;">${c.desc}</span>`);
        homeMapMarkers.push(m);
      });
    });
  }

  /* "Get My Location" — demo only, no real GPS yet. Recentres the home map on Selangor
     (the app's default reference area) and hands off to the Find a Clinic tab if clicked again. */
  function getMyLocation(){
    const label = document.getElementById('hm-locate-label');
    const original = label.textContent;
    label.textContent = currentLang === 'en' ? 'Locating…' : 'Mencari lokasi…';
    setTimeout(()=>{
      const s = stateData['Selangor'];
      if(homeMap) homeMap.setView([s.lat, s.lng], 11);
      document.getElementById('clinicState').value = 'Selangor';
      label.textContent = original;
    }, 700);
  }

  /* homepage: stat cards + DOSM callout, computed from real data already loaded */
  function renderHomeStats(){
    document.getElementById('stat-num1').textContent = schemesData.length;
    document.getElementById('stat-num2').textContent = Object.keys(stateData).length;
    document.getElementById('stat-num3').textContent = '40+';

    const midAge = riskData.by_age_band['41-59'];
    if(midAge){
      const causeText = currentLang === 'en' ? midAge.top_cause_en : midAge.top_cause_bm;
      document.getElementById('callout-text').textContent = currentLang === 'en'
        ? `${causeText} caused ${midAge.share_pct}% of deaths among Malaysians aged 41–59 in 2024 — most of it is preventable with regular screening.`
        : `${causeText} menyebabkan ${midAge.share_pct}% kematian dalam kalangan rakyat Malaysia berumur 41–59 tahun pada 2024 — kebanyakannya boleh dicegah dengan saringan berkala.`;
    }
  }
  function setLang(lang){
    currentLang = lang;
    applyLang();
  }

  /* ================= live database data (Netlify Functions -> Neon Postgres) =================
     Runs in the background after first paint. If these fail (e.g. DATABASE_URL not yet set
     in Netlify, or the function isn't deployed), the embedded riskData/schemesData above keep
     working exactly as before — the site never breaks because of this. */
  async function loadLiveRiskData(){
    try{
      const res = await fetch('/.netlify/functions/get-risk-data');
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const rows = await res.json();
      if(!Array.isArray(rows) || rows.length === 0) throw new Error('empty response');

      const byAgeBand = {};
      const bySex = {};
      rows.forEach(r => {
        if(r.age_group && !r.sex && r.state === 'Malaysia' && !byAgeBand[r.age_group]){
          byAgeBand[r.age_group] = { top_cause_en:r.cause, top_cause_bm:r.cause, share_pct:Number(r.share_pct), deaths:r.deaths };
        }
        if(r.sex && !r.age_group && r.state === 'Malaysia'){
          const key = r.sex.toLowerCase();
          if(!bySex[key]) bySex[key] = { top_cause_en:r.cause, top_cause_bm:r.cause, share_pct:Number(r.share_pct) };
        }
      });
      if(Object.keys(byAgeBand).length >= 3) riskData.by_age_band = byAgeBand;
      if(Object.keys(bySex).length >= 2) riskData.by_sex = bySex;
      console.log('[SaringKu] Live risk data loaded from database:', Object.keys(byAgeBand).length, 'age bands.');
    } catch(err){
      console.warn('[SaringKu] Live risk data unavailable, using embedded fallback:', err.message);
    }
  }

  async function loadLiveSchemes(){
    try{
      const res = await fetch('/.netlify/functions/get-schemes');
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const rows = await res.json();
      if(!Array.isArray(rows) || rows.length === 0) throw new Error('empty response');

      let matched = 0;
      rows.forEach(row => {
        const local = schemesData.find(s => s.id === row.program_code);
        if(!local) return;
        matched++;
        local.name_en = row.name_en || local.name_en;
        local.name_bm = row.name_bm || local.name_bm;
        local.provider = row.provider || local.provider;
        if(row.cost_rm !== undefined && row.cost_rm !== null) local.cost_rm = Number(row.cost_rm);
        if(row.covers) local.covers = row.covers.split(',').map(s => s.trim());
        if(row.how_to_access) local.how_to_access_en = row.how_to_access; // DB has no BM variant of this field; BM text stays as embedded
        local.url = row.url || local.url;
        local.copy_en = row.copy_en || local.copy_en;
        local.copy_bm = row.copy_bm || local.copy_bm;
      });
      console.log('[SaringKu] Live scheme data loaded from database:', matched, 'of', schemesData.length, 'programmes matched.');
    } catch(err){
      console.warn('[SaringKu] Live scheme data unavailable, using embedded fallback:', err.message);
    }
  }

  /* ================= init ================= */
  buildSelect(document.getElementById('sex'), sexOptions);
  buildSelect(document.getElementById('state'), stateList, 'Selangor');
  buildSelect(document.getElementById('smoke'), smokeOptions);
  buildSelect(document.getElementById('lastCheck'), lastCheckOptions);
  buildSelect(document.getElementById('householdBand'), householdBandOptions);
  buildSelect(document.getElementById('clinicState'), stateList, 'Selangor');
  loadForm();
  applyLang();
  initHomeMap();
  loadLiveRiskData().then(renderHomeStats);
  loadLiveSchemes().then(renderHomeStats);

  /* ---------- loading screen sequence ---------- */
  window.addEventListener('load', function(){
    setTimeout(function(){
      const ls = document.getElementById('loadingScreen');
      if(ls){
        ls.classList.add('hide');
        setTimeout(()=> ls.remove(), 600);
      }
    }, 1700);
  });
</script>

</body>
